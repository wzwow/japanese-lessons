<script>

const LESSON = "lesson-20";

   parts:[["会議室","kaigishitsu","meeting room","かいぎしつ"],["は","wa","(topic marker)","わ"],["どちら","dochira","which way / where (polite)"],["ですか","desu ka","is it?"]],
   note:"The polite version of 会議室はどこですか (Lesson 19). どちら sounds softer and more respectful, so it's the safer choice at a client's office or with reception staff. Swap in any place: 受付はどちらですか."},

   note:"What you say when you lead a visitor to the meeting room or your desk. Learn it as a set phrase for now: the particle へ (toward) comes properly in Week 5. Note that へ is pronounced \"e\" here, just as は is pronounced \"wa\". A small open-hand gesture in the direction you're going goes with it naturally."},

   note:"Use こちら instead of これ when you present something to a client; it sounds more polished. が (rather than は) puts the focus on \"this one\", which fits the moment you hand it over or put it on screen. It also answers 最終版はどれですか (Lesson 18) neatly."},

   note:"The polite version of お手洗いはあそこです. Handy when a visitor at your studio asks お手洗いはどこですか (Lesson 18). Point with an open hand rather than one finger, which is the polite way to indicate a direction in Japan."},

];

  ["窓","mado","window","まど"],
  ["ドア","doa","door"],
  ["壁","kabe","wall","かべ"],
  ["棚","tana","shelf","たな"],
  ["ロビー","robī","lobby"],
  ["休憩室","kyūkeishitsu","break room","きゅうけいしつ"],
];
const G = {pattern:"こちら / そちら / あちら / どちら ― the polite こ・そ・あ・ど words",
  explain:"You've now met three sets of こ・そ・あ・ど words: things (<b>これ / それ / あれ / どれ</b>), noun-pointers (<b>この / その / あの / どの</b>) and places (<b>ここ / そこ / あそこ / どこ</b>). The <b>ちら</b> set is the polite one, and it does several jobs: <b>direction</b> (こちらへどうぞ, this way please), <b>place</b> (会議室はどちらですか, a softer どこ), <b>a thing you're presenting</b> (こちらが最終版です, a softer これ), and <b>which of two</b> (どちらがいいですか). The distance logic is the same: こちら near me, そちら near you, あちら away from both of us, どちら which or where. With clients, reception staff and anyone senior, the ちら words are the safe default.",
  examples:[["受付はどちらですか。― あちらです。","Uketsuke wa dochira desu ka. — Achira desu.","Which way is reception? — It's over there.","うけつけはどちらですか。あちらです。"],["こちらがロゴの案です。","Kochira ga rogo no an desu.","This is the logo proposal.","こちらがロゴのあんです。"],["そちらはどうですか。","Sochira wa dō desu ka.","How about that one (on your side)?","そちらはどうですか。"]],
  mistake:"Using どちら when there are more than two options. ✓ どちらがいいですか for A or B, but ✓ どれがいいですか when you're showing three or more versions. Also, the ちら words don't sit directly before a noun: ✗ こちらデザイン. Use この (このデザイン) or こちらの (こちらのデザイン, \"the design on this side\")."};

const D = [
  ["Tanaka","すみません、会議室はどちらですか。","Sumimasen, kaigishitsu wa dochira desu ka.","Excuse me, which way is the meeting room?","すみません、かいぎしつはどちらですか。"],
  ["you","こちらへどうぞ。","Kochira e dōzo.","This way, please.","こちらえどうぞ。"],
  ["you","こちらがA案です。そちらはB案です。","Kochira ga ē-an desu. Sochira wa bī-an desu.","This is option A. That one (by you) is option B.","こちらがエーあんです。そちらはビーあんです。"],
  ["Tanaka","そうですか。素敵ですね。","Sō desu ka. Suteki desu ne.","I see. They're lovely.","そうですか。すてきですね。"],
  ["you","どちらがいいですか。","Dochira ga ii desu ka.","Which do you prefer?"],
  ["Tanaka","こちらがいいです。","Kochira ga ii desu.","I like this one."],
];
const Q = [
  {type:"listen", prompt:"Listen. What does it mean?", say:"こちらへどうぞ。", choices:["This way, please.","Which way is it?","It's over there.","This is the final version."], answer:0},
  {type:"choose", prompt:"You're showing a client two colour options, A and B. How do you ask which they prefer?", choices:["どちらがいいですか。","どれがいいですか。","どこがいいですか。"], answer:0, explain:"With exactly two options, use どちら (which of two). どれ is for three or more, and どこ asks about a place.", say:"どちらがいいですか。"},
  {type:"particle", prompt:"Fill in the particle: こちら ___ 最終版です。 (This is the final version.)", choices:["が","を","へ"], answer:0, explain:"が puts the focus on \"this one\" as you present it: こちらが最終版です.", say:"こちらがさいしゅうばんです。"},
  {type:"choose", prompt:"You're at a client's office and want to ask reception, politely, which way the meeting room is. What do you say?", choices:["会議室はどちらですか。","会議室はどれですか。","会議室はあちらです。"], answer:0, explain:"どちら is the polite way to ask where. どれ means \"which one\" from a set, and あちらです is an answer, not a question.", say:"かいぎしつはどちらですか。"},
  {type:"order", prompt:"Put the words in order: \"The restroom is over there.\" (polite)", tiles:["お手洗い","は","あちら","です"], answer:"お手洗いはあちらです", say:"おてあらいはあちらです。"},
];
const S = [
  {prompt:"A visitor has arrived at your studio. Lead them in and say \"This way, please.\"", jp:"こちらへどうぞ。", ro:"Kochira e dōzo.", say:"こちらえどうぞ。"},
  {prompt:"Put the final design on screen and present it: \"This is the final version.\"", jp:"こちらが最終版です。", ro:"Kochira ga saishūban desu.", say:"こちらがさいしゅうばんです。"},
  {prompt:"You've shown two layout options. Ask the client which one they prefer.", jp:"どちらがいいですか。", ro:"Dochira ga ii desu ka."},
];
/*END DATA*/

// ---------- engine (shared by every lesson; edit data above, not below) ----------
const $=id=>document.getElementById(id);
const A=f=>f.includes(":")?`audio/${f.split(":")[0]}/${f.split(":")[1]}.mp3`:`audio/${LESSON}/${f}.mp3`;
const store=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};
let cur,seq=0;
function stopAll(){seq++;if(cur){cur.pause();cur=null}speechSynthesis.cancel();document.querySelectorAll(".playing").forEach(e=>e.classList.remove("playing"))}
function speak(t,r=.85,done){const u=new SpeechSynthesisUtterance(t);u.lang="ja-JP";u.rate=r;if(done)u.onend=done;speechSynthesis.speak(u)}
function play(f,t,r=.9,done,keep){if(!keep)stopAll();if(cur){cur.pause()}speechSynthesis.cancel();
 const a=new Audio(A(f));cur=a;let fb=false;const fall=()=>{if(!fb){fb=true;speak(t,r,done)}};
 a.onended=()=>{if(!fb&&done)done()};a.onerror=fall;a.play().catch(fall)}
const norm=s=>s.replace(/[？?、。！!\s.,A-Za-z〜ー]/g,"");
function score(heard,target){const t=norm(target);let m=0;for(const c of norm(heard))if(t.includes(c))m++;return t.length?Math.round(100*Math.min(m,t.length)/t.length):0}
function mic(target,el,after){const R=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!R){el.textContent="Speech recognition isn't supported in this browser. Try Chrome.";return}
 stopAll();const r=new R();r.lang="ja-JP";el.textContent="Listening...";
 r.onresult=e=>{const h=e.results[0][0].transcript,s=score(h,target);
  el.innerHTML=`I heard: <b>${h}</b><br>`+(s>=70?`<span class="ok">Nice, that's about ${s}% of it. 🎉</span>`:`<span class="bad">Close, about ${s}%. Try the slow version and go again.</span>`);if(after)after(s)};
 r.onerror=e=>{el.textContent="Mic error: "+e.error};r.start()}
const sayOf=(o)=>o.say||o.jp;
// ---------- sections ----------
function progress(){const done=store("jl-done")||[],pct=Math.round(100*META.lesson/META.total);
 const label=META.review?`Stage ${META.stage} · Week ${META.week} review · Lesson ${META.lesson} of ${META.total}`:`Stage ${META.stage} · Week ${META.week} · Lesson ${META.lesson} of ${META.total}`;
 return `<div class="card"><div class="pips">${[1,2,3,4,5].map(i=>`<i class="${i<META.stage?"done":i===META.stage?"on":""}">Stage ${i}</i>`).join("")}</div>
 <b>${label}</b><div class="bar"><i style="width:${pct}%"></i></div><div class="muted" id="donec">${done.length} lesson${done.length===1?"":"s"} marked complete${done.includes(LESSON)?" · this one is done ✅":""}</div></div>`}
function warm(){if(!WARM.length)return"";const rates=store("jl-rate")||{};
 return `<h2 class="sh">① Warm-up review</h2><p class="shd">Read the English and try to say it in Japanese, then tap <b>Show</b> to check and hear it. Rate how well you knew it.</p><div class="card">${WARM.map((w,k)=>`<div class="wu" id="wu${k}"><div><div class="q">${w.en}</div><div class="a"><b>${w.jp}</b><div class="ro">${w.ro}</div></div></div>
 <div><button class="alt sm" onclick="wuShow(${k})">Show</button><span class="rate">${["😊","😐","😕"].map(e=>`<button class="${rates[w.ref||LESSON+":r"+k]===e?"sel":""}" onclick="wuRate(${k},'${e}',this)">${e}</button>`).join("")}</span></div></div>`).join("")}</div>`}
function wuShow(k){const w=WARM[k];$("wu"+k).classList.add("open");play(w.ref||"r"+k,sayOf(w))}
function wuRate(k,e,b){const r=store("jl-rate")||{};r[WARM[k].ref||LESSON+":r"+k]=e;store("jl-rate",r);b.parentNode.querySelectorAll("button").forEach(x=>x.classList.toggle("sel",x===b))}
function phrases(){if(!P.length)return"";return `<h2 class="sh">② New phrases</h2><p class="shd">Tap a word to hear it. Press ▶ to hear the whole phrase, 🐢 for slow, then 🎤 and say it back.</p>`+P.map((p,i)=>`<div class="card"><div class="jp">${i+1}. ${p.jp}</div><div class="ro">${p.ro}</div><div class="en">${p.en}</div>
<div class="parts">${p.parts.map((x,j)=>`<div class="part" onclick="play('p${i}_w${j}',P[${i}].parts[${j}][3]||P[${i}].parts[${j}][0])"><b>${x[0]}</b>${x[1]}<br><small>${x[2]}</small></div>`).join("")}</div>
<div class="note">${p.note}</div>
<button onclick="play('p${i}',sayOf(P[${i}]),.9)">▶ Play</button><button class="alt" onclick="play('p${i}_slow',sayOf(P[${i}]),.5)">🐢 Slow</button><button class="alt" onclick="mic(P[${i}].jp,$('r${i}'))">🎤 Say it back</button>
<div class="res" id="r${i}"></div></div>`).join("")}
function grammar(){if(!G)return"";return `<h2 class="sh">③ Grammar point</h2><div class="card"><div class="pat">${G.pattern}</div><p>${G.explain}</p>
${G.examples.map((x,k)=>`<div class="ex" onclick="play('g${k}',G.examples[${k}][3]||G.examples[${k}][0])"><b>${x[0]}</b> 🔊<div class="ro">${x[1]}</div><div>${x[2]}</div></div>`).join("")}
${G.mistake?`<div class="mis">⚠️ <b>Common mistake:</b> ${G.mistake}</div>`:""}</div>`}
let youMode=false;
function dialogue(){if(!D.length)return"";return `<h2 class="sh">④ Mini dialogue</h2><p class="shd">${DTITLE||""}</p><div class="card">
<button onclick="playAll()">▶ Play all</button><button class="alt" onclick="stopAll()">■ Stop</button><button class="alt" id="bro" onclick="document.body.classList.toggle('noro');this.textContent=document.body.classList.contains('noro')?'Show romaji':'Hide romaji'">Hide romaji</button><button class="alt" id="ben" onclick="document.body.classList.toggle('noen');this.textContent=document.body.classList.contains('noen')?'Show English':'Hide English'">Hide English</button><button class="alt" id="bym" onclick="toggleYou()">🎤 You speak mode</button>
<div style="margin-top:10px">${D.map((d,k)=>`<div class="dl ${d[0]==="you"?"you":""}" id="dl${k}"><div class="who">${d[0]==="you"?"You":d[0]}</div><div class="tx">
<div class="show"><b>${d[1]}</b><div class="ro">${d[2]}</div></div>${d[0]==="you"?`<div class="yp hid">Your line: say it with 🎤 <button class="alt sm" onclick="mic(D[${k}][1],$('dr${k}'))">🎤</button> <button class="alt sm" onclick="revealLine(${k})">Show</button></div>`:""}
<div class="den">${d[3]}</div><div class="res" id="dr${k}"></div></div><button class="alt sm" onclick="playLine(${k})">▶</button></div>`).join("")}</div></div>`}
function playLine(k,done,keep){const d=D[k];$("dl"+k).classList.add("playing");play("d"+k,d[4]||d[1],.9,()=>{$("dl"+k).classList.remove("playing");done&&done()},keep)}
function playAll(){stopAll();const my=seq;const step=k=>{if(k>=D.length||my!==seq)return;
 if(youMode&&D[k][0]==="you"){$("dl"+k).classList.add("playing");setTimeout(()=>{if(my===seq){$("dl"+k).classList.remove("playing");step(k+1)}},3500);return}
 playLine(k,()=>setTimeout(()=>{if(my===seq)step(k+1)},400),true)};step(0)}
function toggleYou(){youMode=!youMode;$("bym").textContent=youMode?"Show all lines":"🎤 You speak mode";
 D.forEach((d,k)=>{if(d[0]!=="you")return;const l=$("dl"+k);l.querySelector(".show").classList.toggle("hid",youMode);l.querySelector(".yp").classList.toggle("hid",!youMode)})}
function revealLine(k){$("dl"+k).querySelector(".show").classList.remove("hid")}
let qDone={},qRight=0;const shuffled={};
function quiz(){if(!Q.length)return"";return `<h2 class="sh">${META.review?"②":"⑤"} Quick quiz</h2><p class="shd">Instant feedback. Your best score is saved on this device.</p><div class="card">${Q.map((q,k)=>{
 let body="";if(q.type==="order"){shuffled[k]=[...q.tiles].sort(()=>Math.random()-.5);
  body=`<div class="ans" id="qa${k}"></div><div class="tiles" id="qt${k}">${shuffled[k].map((t,j)=>`<button onclick="tile(${k},${j},this)">${t}</button>`).join("")}</div><button class="sm" onclick="checkOrder(${k})">Check</button><button class="alt sm" onclick="resetOrder(${k})">Reset</button>`}
 else body=(q.type==="listen"?`<button class="sm" onclick="play('q${k}',Q[${k}].say)">▶ Listen</button><br>`:"")+`<div class="ch">${q.choices.map((c,j)=>`<button onclick="answer(${k},${j},this)">${c}</button>`).join("")}</div>`;
 return `<div class="qq"><div class="qp">${k+1}. ${q.prompt}</div>${body}<div class="res" id="qr${k}"></div></div>`}).join("")}
 <div class="score" id="qscore">Score: 0 / ${Q.length}</div><div class="muted" id="qbest"></div></div>`}
function qMark(k,ok){if(qDone[k])return;qDone[k]=1;if(ok)qRight++;$("qr"+k).innerHTML=ok?'<span class="ok">Correct! ✓</span>':`<span class="bad">Not quite. Answer: <b>${Q[k].type==="order"?Q[k].answer:Q[k].choices[Q[k].answer]}</b></span>`+(Q[k].explain?` · ${Q[k].explain}`:"");
 const n=Object.keys(qDone).length;$("qscore").textContent=`Score: ${qRight} / ${Q.length}`+(n===Q.length?(qRight===Q.length?" 🎉 Perfect!":" · finished"):"");
 if(n===Q.length){const b=store("jl-quiz")||{};b[LESSON]=Math.max(b[LESSON]||0,qRight);store("jl-quiz",b);showBest()}}
function showBest(){const b=(store("jl-quiz")||{})[LESSON];if(b!=null&&$("qbest"))$("qbest").textContent=`Best saved score: ${b} / ${Q.length}`}
function answer(k,j,b){if(qDone[k])return;const ok=j===Q[k].answer;b.classList.add(ok?"right":"wrong");if(!ok)b.parentNode.children[Q[k].answer].classList.add("right");if(Q[k].say&&Q[k].type!=="listen")play("q"+k,Q[k].say);qMark(k,ok)}
function tile(k,j,b){if(qDone[k])return;b.disabled=true;$("qa"+k).textContent+=shuffled[k][j]}
function resetOrder(k){if(qDone[k])return;$("qa"+k).textContent="";$("qt"+k).querySelectorAll("button").forEach(b=>b.disabled=false)}
function checkOrder(k){if(qDone[k])return;const ok=norm($("qa"+k).textContent)===norm(Q[k].answer);qMark(k,ok);if(Q[k].say)play("q"+k,Q[k].say)}
function speakback(){if(!S.length)return"";return `<h2 class="sh">⑥ Speak-back practice</h2><p class="shd">Read the English, answer out loud with 🎤, then reveal the target answer.</p><div class="card">${S.map((s,k)=>`<div class="qq"><div class="qp">${k+1}. ${s.prompt}</div>
<button class="sm" onclick="mic(S[${k}].jp,$('sr${k}'),()=>sbShow(${k}))">🎤 Answer</button><button class="alt sm" onclick="sbShow(${k})">Show answer</button>
<div class="res" id="sr${k}"></div><div class="hid" id="sa${k}"><b style="font-size:19px">${s.jp}</b> <button class="alt sm" onclick="play('s${k}',sayOf(S[${k}]))">▶</button><div class="ro">${s.ro}</div></div></div>`).join("")}</div>`}
function sbShow(k){$("sa"+k).classList.remove("hid")}
function finish(){const done=(store("jl-done")||[]).includes(LESSON);return `<div class="card fin"><button id="bdone" onclick="markDone()">${done?"✅ Lesson complete":"Mark lesson complete"}</button>
<p>${META.prev?`<a href="${META.prev}">← ${META.prevTitle||"Previous lesson"}</a>`:""}${META.prev&&META.next?" &nbsp;·&nbsp; ":""}${META.next?`<a href="${META.next}">Next: ${META.nextTitle||"tomorrow's lesson"} →</a>`:"<span class='muted'>The next lesson is coming soon.</span>"}</p></div>`}
function markDone(){const d=store("jl-done")||[];if(!d.includes(LESSON))d.push(LESSON);store("jl-done",d);$("bdone").textContent="✅ Lesson complete";
 $("donec").textContent=`${d.length} lesson${d.length===1?"":"s"} marked complete · this one is done ✅`}
function vocab(){if(!V.length){$("vocab").remove();return}
 $("vocab").innerHTML='<h2>Extra vocabulary</h2>'+V.map((v,k)=>`<div class="vi" onclick="play('v${k}',V[${k}][3]||V[${k}][0])"><b>${v[0]}</b> <span class="r">${v[1]}</span><small>${v[2]}</small></div>`).join("")}
document.title=TITLE;
$("page").innerHTML=`<h1>${TITLE}</h1><p class="sub">${SUB}</p>`+progress()+warm()+(META.review?quiz():phrases()+grammar()+dialogue()+quiz()+speakback())+finish();
vocab();showBest();
</script>
<script src="../nav.js"></script>
</body></html>
