function quiz(){if(!Q.length)return"";return `<h2 class="sh">${META.review?"②":"⑤"} Quick quiz</h2><p class="shd">Instant feedback. Your best score is saved on this device.</p><div class="card">${Q.map((q,k)=>{
 let body="";if(q.type==="order"){shuffled[k]=[...q.tiles].sort(()=>Math.random()-.5);
  body=`<div class="ans" id="qa${k}"></div><div class="tiles" id="qt${k}">${shuffled[k].map((t,j)=>`<button onclick="tile(${k},${j},this)">${t}</button>`).join("")}</div><button class="sm" onclick="checkOrder(${k})">Check</button><button class="alt sm" onclick="resetOrder(${k})">Reset</button>`}
 else body=(q.type==="listen"?`<button class="sm" onclick="play('q${k}',Q[${k}].say)">▶ Listen</button><br>`:"")+`<div class="ch">${q.choices.map((c,j)=>`<button onclick="answer(${k},${j},this)">${c}</button>`).join("")}</div>`;
 return `<div class="qq"><div class="qp">${k+1}. ${q.prompt}</div>${body}<div class="res" id="qr${k}"></div></div>`}).join("")}
 <div class="score" id="qscore">Score: 0 / ${Q.length}</div><div class="muted" id="qbest"></div></div>`}
function qMark(k,ok){if(qDone[k])return;qDone[k]=1;if(ok)qRight++;$("qr"+k).innerHTML=ok?'<span class="ok">Correct! ✓</span>':`<span class="bad">Not quite. Answer: <b>${Q[k].type==="order"?Q[k].answer:Q[k].choices[Q[k].answer]}</b></span>`+(Q[k].explain?` · ${Q[k].explain}`:"");
 const n=Object.keys(qDone).length;$("qscore").textContent=`Score: ${qRight} / ${Q.length}`+(n===Q.length?(qRight===Q.length?" 🎉 Perfect!":" · finished"):"");
 if(n===Q.length){const b=store("jl-quiz")||{};b[LESSON]=Math.max(b[LESSON]||0,qRight);store("jl-quiz",b);showBest()}}
function showBest(){const b=(store("jl-quiz")||{})[LESSON];if(b!=null&&$("qbest"))$("qbest").textContent=`Best saved score: ${b} / ${Q.length}`}
function answer(k,j,b){if(qDone[k])return;const ok=j===Q[k].answer;b.classList.add(ok?"right":"wrong");if(!ok)b.parentNode.children[Q[k].answer].classList.add("right");if(Q[k].say&&Q[k].type!=="listen")play("q"+k,Q[k].say);qMark(k,ok)}
function tile(k,j,b){if(qDone[k])return;b.disabled=true;$("qa"+k).textContent+=shuffled[k][j]}
function resetOrder(k){if(qDone[k])return;$("qa"+k).textContent="";$("qt"+k).querySelectorAll("button").forEach(b=>b.disabled=false)}
function checkOrder(k){if(qDone[k])return;const ok=norm($("qa"+k).textContent)===norm(Q[k].answer);qMark(k,ok);if(Q[k].say)play("q"+k,Q[k].say)}
function speakback(){if(!S.length)return"";return `<h2 class="sh">⑥ Speak-back practice</h2><p class="shd">Read the English, answer out loud with 🎤, then reveal the target answer.</p><div class="card">${S.map((s,k)=>`<div class="qq"><div class="qp">${k+1}. ${s.prompt}</div>
<button class="sm" onclick="mic(S[${k}].jp,$('sr${k}'),()=>sbShow(${k}))">🎤 Answer</button><button class="alt sm" onclick="sbShow(${k})">Show answer</button>
<div class="res" id="sr${k}"></div><div class="hid" id="sa${k}"><b style="font-size:19px">${s.jp}</b> <button class="alt sm" onclick="play('s${k}',sayOf(S[${k}]))">▶</button><div class="ro">${s.ro}</div></div></div>`).join("")}</div>`}
function sbShow(k){$("sa"+k).classList.remove("hid")}
function finish(){const done=(store("jl-done")||[]).includes(LESSON);return `<div class="card fin"><button id="bdone" onclick="markDone()">${done?"✅ Lesson complete":"Mark lesson complete"}</button>
<p>${META.prev?`<a href="${META.prev}">← ${META.prevTitle||"Previous lesson"}</a>`:""}${META.prev&&META.next?" &nbsp;·&nbsp; ":""}${META.next?`<a href="${META.next}">Next: ${META.nextTitle||"tomorrow's lesson"} →</a>`:"<span class='muted'>The next lesson is coming soon.</span>"}</p></div>`}
function markDone(){const d=store("jl-done")||[];if(!d.includes(LESSON))d.push(LESSON);store("jl-done",d);$("bdone").textContent="✅ Lesson complete";
 $("donec").textContent=`${d.length} lesson${d.length===1?"":"s"} marked complete · this one is done ✅`}
function vocab(){if(!V.length){$("vocab").remove();return}
 $("vocab").innerHTML='<h2>Extra vocabulary</h2>'+V.map((v,k)=>`<div class="vi" onclick="play('v${k}',V[${k}][3]||V[${k}][0])"><b>${v[0]}</b> <span class="r">${v[1]}</span><small>${v[2]}</small></div>`).join("")}
document.title=TITLE;
$("page").innerHTML=`<h1>${TITLE}</h1><p class="sub">${SUB}</p>`+progress()+warm()+(META.review?quiz():phrases()+grammar()+dialogue()+quiz()+speakback())+finish();
vocab();showBest();
</script>
<script src="../nav.js"></script>
</body></html>
