name: Unpack audio
on:
  push:
    paths: ['audio-bundle.b64']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          base64 -d audio-bundle.b64 | tar xz -C lessons
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add lessons/audio
          git diff --cached --quiet || git commit -m "Unpack lesson audio mp3s"
          git push
